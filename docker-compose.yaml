services:
  tunnel:
    image: cloudflare/cloudflared
    restart: always
    env_file:
      - .tunnel.env
    command: tunnel run
    environment:
      NO_AUTOUPDATE: true
    networks:
      - tunnel

  pastebin:
    extends:
      file: ./pastebin/docker-compose.yaml
      service: pastebin
    networks:
      - tunnel

  share:
    extends:
      file: ./copyparty/docker-compose.yaml
      service: share
    networks:
      - tunnel

volumes:
  cp_cache:

networks:
  tunnel:
